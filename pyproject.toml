[project]
name = "fp-core"
version = "0.1.0"
description = "Accounting knowledge graph built on a domain-driven ontology"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "neo4j>=5.0",
    "python-dotenv",
    "uvicorn",
    "PyJWT[crypto]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["UP035", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"evals/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "persistence", "mcp_server"]
